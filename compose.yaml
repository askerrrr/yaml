version: "3.8"
name: "bot"

services:
  app:
    container_name: bot
    image: milkydad/bot
    ports:
      - "3000:3000"
    volumes:
      - /var/lib/docker_app/yaml/env.js:/bot/env.js
    restart: always
    environment:
      - MONGO_URL=mongodb://db:27017
    depends_on:
      - db
    networks: 
      - back

  db:
    container_name: mongodb
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    restart: always
    networks:
      - back

volumes:
  mongodb:
networks:
      - back
           driver: bridge  


name: "app"

services:
  app:
    image: milkydad/testapp
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./env_var.js:/app/env_var.js
      - app-data:/app
    environment:
      - MONGO_HOST=db
      - MONGO_PORT=38143
      - HOST=0.0.0.0
      - MONGO_INITDB_ROOT_USERNAME=
      - MONGO_INITDB_ROOT_PASSWORD=

    networks:
      - front
      - back
    container_name: app
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    ports:
      - "38143:38143"
    restart: always
    env_file: [.env-mongo]
    volumes:
      - mongodb:/data/db
      - ./mongod.conf:/etc/mongod.conf
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - back
    command: [--auth, --port, "38143"] 
    container_name: db

  apache:
    image: httpd:2.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./logs:/usr/local/apache2/logs
      - /etc/letsencrypt:/etc/letsencrypt
      - app-data:/var/www/app
      - /etc/timezone:/etc/timezone
    command: >
      sh -c "httpd -D FOREGROUND"
    networks:
      - front
    container_name: apache
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - app-data:/var/www/app/
    command: certonly --webroot -w /var/www/app/public/html -d silk-road-store.ru --email asker_sulanov1999@mail.ru --agree-tos --verbose
    depends_on:
      - apache
    networks:
      - front

volumes:
  mongodb:
  app-data:
networks:
  front:
    driver: bridge
  back:
    driver: bridge

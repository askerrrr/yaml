name: "app"

services: 
 app: 
    image: milkydad/app
    ports: 
         - "3000:3000"
    restart: always
    volumes:
         - /home/app/env_var.js:/app/env_var.js
         - app-data:/app
    environment:
         - MONGO_URL=mongodb://db:27017
         - HOST=0.0.0.0
    networks:
         - front
         - back
    container_name: app
    depends_on: 
         - mongodb 

 mongodb:
    image: mongo
    ports:
         - "27017:27017"
    restart: always
    volumes:
         - mongodb:/data/db
    networks:
         - back
    container_name: db
 


 apache:
    image: httpd
    ports: 
         - "80:80"
       # - "443:443"
    volumes:
         - app-data:/usr/local/apache2/htdocs/app
         - /home/app/httpd.conf:/usr/local/apache2/conf/httpd.conf
         - ./logs:/usr/local/apache2/logs
         - /etc/letsencrypt:/etc/letsencrypt
    command: >
      sh -c "httpd -D FOREGROUND"
    networks:
            - front
    depends_on: 
         - app
    container_name: apache
    
 certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
         - /etc/letsencrypt:/etc/letsencrypt
         - /var/lib/letsencrypt:/var/lib/letsencrypt
         - app-data:/usr/local/apache2/htdocs/app
    command: certonly --webroot --webroot-path=/usr/local/apache2/htdocs/app -d silk-road-store.ru --email asker_sulanov1999@mail.ru --agree-tos --non-interactive
    depends_on:
         - apache
volumes:
     mongodb:
     app-data:
networks:
        front:
             driver: bridge
        back:
             driver: bridge

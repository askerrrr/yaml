services:
  app:
    image: app
    container_name: app
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./env_var.js:/app/env_var.js
      - app-data:/app
    environment:
      - MONGO_HOST=db
      - MONGO_PORT=38143
      - HOST=0.0.0.0
      - MONGO_INITDB_ROOT_USERNAME=Gilgamesh
      - MONGO_INITDB_ROOT_PASSWORD=Q9khdcpx
      - MONGO_INITDB_DATABASE=admin
    networks:
      - front
      - back
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: db
    restart: always
    env_file: [.env-mongo]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - /var/lib/docker/volumes/app_app-data/_data/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - back
    command: [--auth, --port, "38143"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=Gilgamesh
      - MONGO_INITDB_ROOT_PASSWORD=Q9khdcpx
      - MONGO_ROOT_USER=Asker
      - MONGO_ROOT_PASSWD=Q9khdcpx
      - HASH_LOGIN=$$argon2id$$v=19$$m=65536,t=3,p=4$$1Fk2sjOdiZd/n5AV+oq+bA$$eNdvvWkKHYsDDjJeZLXbqk+51ghNu16ro+W0QT/0cj0
      - HASH_PASSWD=$$argon2id$$v=19$$m=65536,t=3,p=4$$VfGKMEoi6a7pPDmuDq9o8A$$jy2omxBZd9YFsrsxSCcEUQzoqC8ksMsW0mitTyo01Vs

  apache:
    image: httpd:2.4
    container_name: apache
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./logs:/usr/local/apache2/logs
      - /etc/letsencrypt:/etc/letsencrypt
      - app-data:/var/www/app
      - /etc/timezone:/etc/timezone
    command: >
      sh -c "httpd -D FOREGROUND"
    networks:
      - front
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - app-data:/var/www/app/
    command: certonly --webroot -w /var/www/app/public/html -d silk-road-store.ru --email asker_sulanov1999@mail.ru --agree-tos --verbose
    depends_on:
      - apache
    networks:
      - front

volumes:
  app-data:
  mongo-data:
  mongo-config:
networks:
  front:
  back:
